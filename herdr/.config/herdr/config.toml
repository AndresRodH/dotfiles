onboarding = false

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[keys]
prefix = "ctrl+a"

[terminal]
shell_mode = "auto"

[ui.toast]
delivery = "system"
delay_seconds = 1

[session]
resume_agents_on_restore = true

[advanced]
scrollback_limit_bytes = 20000000

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"
